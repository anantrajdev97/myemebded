<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Dark</title>
  <style>
    /* Remove default margins, scrollbars, and white borders */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #191919; /* Exact Notion Dark Mode background */
      border: none;
    }
    .tradingview-widget-container {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    iframe {
      border: none !important;
    }
  </style>
</head>
<body>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>

<tv-advanced-chart symbol="eurusd" interval="5" timezone="America/New_York" watchlist="OANDA:XAUUSD,BINANCE:BTCUSDT,OANDA:EURUSD,FX:USDJPY" allow-symbol-change show-drawing-toolbar show-details theme="dark"></tv-advanced-chart>


</body>
</html>
